services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "3000:3000"
    # *** [แก้ไขจุดนี้] ชี้ไปที่ไฟล์ .env ที่อยู่ในโฟลเดอร์ backend ***
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3000
    container_name: frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always