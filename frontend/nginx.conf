server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # **นี่คือการตั้งค่าที่สำคัญที่สุดสำหรับ SPA**
        # ถ้าหา URI ไม่เจอ ให้ fallback กลับไปที่ /index.html เพื่อให้ Vue Router ทำงาน
        try_files $uri $uri/ /index.html; 
    }

    # Cache assets for 1 year
    location ~* \.(css|js|gif|jpe?g|png)$ {
        expires 1y;
        log_not_found off;
    }
}